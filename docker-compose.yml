version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - DATA_PROVIDER=polygon
      - CACHE_ENABLED=true
    volumes:
      - .:/app
    command: python -m api.main

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
